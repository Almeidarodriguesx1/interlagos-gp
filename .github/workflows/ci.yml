name: Verificar simulador
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git fetch --depth=1 origin 87238534d4e5a2addd6b9d851c95fe430a8674bc
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node scripts/check-bundle.mjs
      - run: npm run check:geom
      - run: npm run check:scenery
      - run: npm run verify:models
